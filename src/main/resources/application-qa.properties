# ----------------------------------------------------
# PERFIL: QA (Quality Assurance)
# Stack esperado: Neon (Postgres) + Render (API) + Vercel (Next.js)
# Vars de referencia: /.env.qa.example  ·  Guía: /QA_DEPLOY.md
# ----------------------------------------------------

# Puerto dinámico de Render
server.port=${PORT:8080}
server.forward-headers-strategy=native

# Datasource: acepta DATABASE_* (guías) o SPRING_DATASOURCE_* (legacy)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway: baseline OK en DB QA nueva (vacía). No usar contra DB “sucia” sin historial.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Cloudflare R2 (imágenes). Activar en Render con CLOUDFLARE_R2_ENABLED=true.
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:true}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}

# Seguridad
# Primer arranque: SUPERADMIN_BOOTSTRAP=true (+ SUPERADMIN_BOOTSTRAP_PASSWORD).
# Después del login inicial: pon SUPERADMIN_BOOTSTRAP=false y redeploy.
application.superadmin.bootstrap=${SUPERADMIN_BOOTSTRAP:false}
application.security.jwt.secret-key=${JWT_SECRET}
application.security.trust-forwarded-headers=true
application.security.cors.allowed-origins=${ALLOWED_ORIGINS}

# Solo tokens QR v2 con caducidad (alineado con prod).
application.security.table-qr.allow-legacy-tokens=${TABLE_QR_ALLOW_LEGACY:false}
