# Nombre de la aplicación
spring.application.name=restaurant-backend

# Sin perfil por defecto: exige SPRING_PROFILES_ACTIVE (local | qa | prod).
# Evita arrancar en producción con secretos/JWT del perfil local por accidente.
# Local: export SPRING_PROFILES_ACTIVE=local  (o docker-compose / IDE).

# Hilos Virtuales activos de manera global para todos los perfiles
spring.threads.virtual.enabled=true

# Desactivar open-in-view por buenas prácticas de rendimiento
spring.jpa.open-in-view=false

# Ubicación común de las migraciones
spring.flyway.locations=classpath:db/migration

# Configuración de base de datos base con variables de entorno
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/platolisto}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Seguridad (JWT) — sin default inseguro.
# Perfil local define un secreto de desarrollo; prod/QA exigen JWT_SECRET.
application.security.jwt.secret-key=${JWT_SECRET:}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Solo confiar en X-Forwarded-For / X-Real-IP detrás de un proxy que los sobrescriba.
application.security.trust-forwarded-headers=false

# Ticket STOMP de cocina: corta vida (ms). No sirve para APIs HTTP.
application.security.ws-ticket.expiration-ms=${WS_TICKET_EXPIRATION_MS:60000}

# Impersonación SuperAdmin → tenant: TTL corto (default 30 min).
application.security.impersonation.expiration-ms=${IMPERSONATION_EXPIRATION_MS:1800000}

# Registro público: límite en memoria por IP y por email (una instancia).
application.security.registration.max-attempts-per-ip=${REGISTRATION_MAX_ATTEMPTS_PER_IP:5}
application.security.registration.window-minutes=${REGISTRATION_WINDOW_MINUTES:60}

# Pedidos públicos: límite en memoria por IP y por tenant (una instancia).
application.security.orders.max-attempts-per-key=${ORDER_MAX_ATTEMPTS_PER_KEY:30}
application.security.orders.window-minutes=${ORDER_WINDOW_MINUTES:15}

# Hosts extra permitidos para imageUrl (además de storage local / R2). Lista separada por comas.
application.security.allowed-image-url-hosts=${ALLOWED_IMAGE_URL_HOSTS:}

# SuperAdmin bootstrap: desactivado por defecto (solo local lo habilita).
application.superadmin.bootstrap=false
application.superadmin.email=${SUPERADMIN_EMAIL:superadmin@platolisto.com}
application.superadmin.password=${SUPERADMIN_BOOTSTRAP_PASSWORD:}

# List price Pro (MXN/mes) para MRR estimado operativo — no es facturación cerrada.
application.billing.pro-list-price-mxn=${PRO_LIST_PRICE_MXN:1000}

# CORS: sin defaults amplios. Perfil local define localhost; prod/QA exigen ALLOWED_ORIGINS.
application.security.cors.allowed-origins=${ALLOWED_ORIGINS:}

# Monitoreo (Spring Boot Actuator) — detalles solo con auth
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized

# Multipart (alta de platillos con imagen — R2 ready)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Almacenamiento de imágenes (local por defecto; R2 con cloudflare.r2.enabled=true)
application.storage.local-root=${STORAGE_LOCAL_ROOT:uploads}
application.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

# Cloudflare R2 (S3-compatible). Desactivado en local salvo que se habilite.
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:false}
cloudflare.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME:}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL:}
