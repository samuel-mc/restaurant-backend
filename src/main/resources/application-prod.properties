# ----------------------------------------------------
# PERFIL: PROD (Producción)
# ----------------------------------------------------

# Configuración de Base de Datos para Producción (Obligatorio por Variables de Entorno)
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (Producción: Validar estrictamente, ocultar SQL de consola)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Producción
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false -- Evitar baselines automáticos en producción por seguridad
spring.flyway.baseline-version=0

# Cloudflare R2 (activar en prod con variables de entorno)
cloudflare.r2.enabled=${CLOUDFLARE_R2_ENABLED:true}

# Seguridad: nunca bootstrap SuperAdmin ni secretos por defecto en prod
application.superadmin.bootstrap=false
application.security.jwt.secret-key=${JWT_SECRET}
application.security.trust-forwarded-headers=true
application.security.cors.allowed-origins=${ALLOWED_ORIGINS}

# Solo tokens QR v2 con caducidad (reimprimir mesas si aún hay v1).
application.security.table-qr.allow-legacy-tokens=${TABLE_QR_ALLOW_LEGACY:false}
