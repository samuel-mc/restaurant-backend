# JPA & Hibernate (Local)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway local
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT solo para desarrollo local (sobreescribe JWT_SECRET si no está en el entorno).
# En producción/QA usa siempre JWT_SECRET por variable de entorno.
application.security.jwt.secret-key=${JWT_SECRET:IDKw93Z7Y0D+ab+W4gn2xBwDQ5drsz8VEM8UaKJHUqNynKyf27uTcjWuONUdJ9fR}

# Bootstrap SuperAdmin solo en local (cambia la contraseña vía SUPERADMIN_BOOTSTRAP_PASSWORD).
application.superadmin.bootstrap=true
application.superadmin.password=${SUPERADMIN_BOOTSTRAP_PASSWORD:LocalDevOnly!ChangeMe92}

# Secretos locales (R2, etc.). El archivo NO se versiona.
# Copia application-local-secrets.properties.example → application-local-secrets.properties
spring.config.import=optional:classpath:application-local-secrets.properties
