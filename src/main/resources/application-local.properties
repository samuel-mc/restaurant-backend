# PERFIL: LOCAL
# ----------------------------------------------------

# JPA & Hibernate (Local)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway local
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Secretos locales (R2, etc.). El archivo NO se versiona.
# Copia application-local-secrets.properties.example → application-local-secrets.properties
spring.config.import=optional:classpath:application-local-secrets.properties
