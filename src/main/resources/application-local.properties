# ----------------------------------------------------
# PERFIL: LOCAL
# ----------------------------------------------------

# JPA & Hibernate (Local)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Flyway local
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT / SuperAdmin: define JWT_SECRET y SUPERADMIN_BOOTSTRAP_PASSWORD en el entorno
# o en application-local-secrets.properties (ver el .example). Sin defaults en git.
application.security.jwt.secret-key=${JWT_SECRET:}
application.superadmin.bootstrap=true
application.superadmin.password=${SUPERADMIN_BOOTSTRAP_PASSWORD:}

# CORS solo para desarrollo local (subdominios *.localhost).
application.security.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://*.localhost:3000,http://*.localhost:*}

# En local se permiten QRs v1 sin caducidad (mesas de prueba / impresiones viejas).
application.security.table-qr.allow-legacy-tokens=${TABLE_QR_ALLOW_LEGACY:true}

# Secretos locales (R2, JWT, etc.). El archivo NO se versiona.
# Copia application-local-secrets.properties.example → application-local-secrets.properties
spring.config.import=optional:classpath:application-local-secrets.properties
